<svg xmlns="http://www.w3.org/2000/svg" width="520" height="180" viewBox="0 0 520 180" role="img" aria-label="Architecture flow representation">
  <rect width="520" height="180" fill="#FFFFFF" />
  <rect x="20" y="24" width="140" height="44" rx="4" fill="#F4F7FA" stroke="#BCC8D4"/>
  <rect x="190" y="24" width="140" height="44" rx="4" fill="#F4F7FA" stroke="#BCC8D4"/>
  <rect x="360" y="24" width="140" height="44" rx="4" fill="#F4F7FA" stroke="#BCC8D4"/>

  <text x="90" y="50" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A37">Data Sources</text>
  <text x="260" y="50" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A37">AI Platform</text>
  <text x="430" y="50" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A37">Business Ops</text>

  <line x1="160" y1="46" x2="190" y2="46" stroke="#637487" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="46" x2="360" y2="46" stroke="#637487" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="96" width="220" height="56" rx="4" fill="#FFFFFF" stroke="#D3DCE6"/>
  <text x="34" y="118" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#283548">Feedback loop</text>
  <text x="34" y="136" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4B5563">Model performance ⇄ user adoption ⇄ data quality</text>

  <rect x="270" y="96" width="230" height="56" rx="4" fill="#FFFFFF" stroke="#D3DCE6"/>
  <text x="284" y="118" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#283548">Constraint map</text>
  <text x="284" y="136" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4B5563">Governance, platform cost, and change capacity</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#637487" />
    </marker>
  </defs>
</svg>
