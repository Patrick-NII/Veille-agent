objective: "Deliver a 5-minute executive brief on one enterprise AI case with decision implications."
audience_level: "AI Program Manager, Head of Data, Deputy CDO"
tone: "Calm, analytical, executive-level"
framework_constraints:
  model: "pAIpers Orchestration Framework"
  pillars:
    - Strategy
    - Architecture
    - Governance
    - Economics
    - Risk
  format: "short form; one bullet per pillar"
required_sections:
  - Header
  - Context
  - Case Snapshot
  - pAIpers Framework
  - Curated Links
  - Executive Decrypt
  - Visual Block
output_constraints:
  title_max_chars: 80
  context_max_words: 60
  case_snapshot_max_words: 80
  links_count_min: 3
  links_count_max: 5
signal_noise_action_format:
  signal: "2 bullets"
  noise: "1 bullet"
  action: "2 bullets"
  budget_implication: "1 line"
  risk_warning: "1 line"
