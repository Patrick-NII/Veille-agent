objective: "Analyze one AI program failure pattern and derive governance decisions."
audience_level: "CDO office, enterprise ML leadership"
tone: "Direct, factual, non-judgmental"
framework_constraints:
  model: "pAIpers Orchestration Framework"
  pillars:
    - Governance
    - Architecture
    - Economics
    - Risk
  format: "full form + autopsy section"
required_sections:
  - Header
  - Context
  - Case Snapshot
  - pAIpers Framework
  - Executive Decrypt
  - Failure Autopsy
  - Checklist
output_constraints:
  context_max_words: 70
  autopsy_max_words: 120
signal_noise_action_format:
  signal: "2 bullets"
  noise: "1 bullet"
  action: "2 bullets"
