objective: "Analyze enterprise AI architecture choices and their long-term consequences."
audience_level: "Enterprise ML Leader, Platform Architect"
tone: "Technical-executive"
framework_constraints:
  model: "pAIpers Orchestration Framework"
  pillars:
    - Architecture
    - Economics
    - Risk
  format: "expanded, architecture-first"
required_sections:
  - Header
  - Context
  - Architecture decision map
  - Build vs Buy
  - Executive Decrypt
  - Visual Block
output_constraints:
  title_max_chars: 80
  context_max_words: 70
signal_noise_action_format:
  signal: "2 bullets"
  noise: "1 bullet"
  action: "2 bullets"
