objective: "Translate external AI signals into enterprise orchestration decisions."
audience_level: "Head of Data, AI steering committee"
tone: "Measured, non-hype"
framework_constraints:
  model: "pAIpers Orchestration Framework"
  pillars:
    - Strategy
    - Governance
    - Economics
  format: "trend-to-decision mapping"
required_sections:
  - Header
  - Context
  - Signal interpretation
  - pAIpers Framework
  - Executive Decrypt
output_constraints:
  title_max_chars: 80
  context_max_words: 60
signal_noise_action_format:
  signal: "2 bullets"
  noise: "1 bullet"
  action: "2 bullets"
